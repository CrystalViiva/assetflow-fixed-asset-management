x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY outside source control}
  ASSETFLOW_ENV: production
  DEBUG: "false"
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to the public host name(s)}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS to the HTTPS admin origin(s)}
  TIME_ZONE: ${TIME_ZONE:-Africa/Lagos}
  DATABASE_URL: postgresql://assetflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/assetflow
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:?Set the internal reverse proxy network CIDR for client throttling}
  PRIVATE_MEDIA_ROOT: /srv/assetflow/private
  STATIC_ROOT: /srv/assetflow/static
  ANALYTICS_MEDIA_ROOT: /srv/assetflow/analytics
  ANALYTICS_MAX_RECORDS_PER_RUN: ${ANALYTICS_MAX_RECORDS_PER_RUN:-100000}
  ANALYTICS_MAX_OUTPUT_BYTES: ${ANALYTICS_MAX_OUTPUT_BYTES:-262144000}
  ANALYTICS_LATE_ARRIVAL_OVERLAP_HOURS: ${ANALYTICS_LATE_ARRIVAL_OVERLAP_HOURS:-48}
  EVIDENCE_MAX_UPLOAD_BYTES: ${EVIDENCE_MAX_UPLOAD_BYTES:-20971520}
  REPORT_EXPORT_MAX_BYTES: ${REPORT_EXPORT_MAX_BYTES:-104857600}
  REPORT_EXPORT_RETENTION_DAYS: ${REPORT_EXPORT_RETENTION_DAYS:-30}
  EMAIL_BACKEND: ${EMAIL_BACKEND:?Set EMAIL_BACKEND to a production transactional email backend}
  EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST for SMTP email delivery}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER for SMTP email delivery}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD outside source control}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL to a verified sender}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL to the HTTPS customer application URL}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assetflow
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [release]
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    environment: *backend-environment
    volumes:
      - production_static_data:/srv/assetflow/static
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120", "--graceful-timeout", "30", "--access-logfile", "-"]
    environment: *backend-environment
    volumes:
      - production_private_data:/srv/assetflow/private
      - production_analytics_data:/srv/assetflow/analytics
      - production_static_data:/srv/assetflow/static:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/v1/ready/', headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0].strip(),'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment: *backend-environment
    volumes:
      - production_private_data:/srv/assetflow/private
      - production_analytics_data:/srv/assetflow/analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend-environment
    volumes:
      - production_analytics_data:/srv/assetflow/analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    environment:
      ASSETFLOW_INGRESS_PROXY_CIDR: ${ASSETFLOW_INGRESS_PROXY_CIDR:?Set the CIDR of the TLS ingress as seen by the frontend container}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_DATA_SOURCE: django
        VITE_BACKEND_API_URL: /api/v1
    ports:
      - "127.0.0.1:${ASSETFLOW_HTTP_PORT:-8080}:80"
    volumes:
      - production_static_data:/srv/assetflow/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  production_postgres_data:
  production_redis_data:
  production_private_data:
  production_analytics_data:
  production_static_data:

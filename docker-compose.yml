services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assetflow
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment: &backend-environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your local .env}
      DEBUG: ${DEBUG:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TIME_ZONE: ${TIME_ZONE:-Africa/Lagos}
      DATABASE_URL: postgresql://assetflow:${POSTGRES_PASSWORD}@db:5432/assetflow
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANALYTICS_MEDIA_ROOT: /srv/assetflow/analytics
      ANALYTICS_MAX_RECORDS_PER_RUN: ${ANALYTICS_MAX_RECORDS_PER_RUN:-100000}
      ANALYTICS_MAX_OUTPUT_BYTES: ${ANALYTICS_MAX_OUTPUT_BYTES:-262144000}
      ANALYTICS_LATE_ARRIVAL_OVERLAP_HOURS: ${ANALYTICS_LATE_ARRIVAL_OVERLAP_HOURS:-48}
    ports:
      - "8000:8000"
    volumes:
      - assetflow_analytics_data:/srv/assetflow/analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=INFO
    environment: *backend-environment
    volumes:
      - assetflow_analytics_data:/srv/assetflow/analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment: *backend-environment
    volumes:
      - assetflow_analytics_data:/srv/assetflow/analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-db:
    image: postgres:17-alpine
    profiles: [airflow, analytics]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-dev:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: [airflow, analytics]
    command: airflow standalone
    environment:
      <<: *backend-environment
      ANALYTICS_MEDIA_ROOT: /srv/assetflow/analytics
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__MAX_MAP_LENGTH: ${AIRFLOW_MAX_MAP_LENGTH:-10000}
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - assetflow_analytics_data:/srv/assetflow/analytics
    depends_on:
      airflow-db:
        condition: service_healthy
      db:
        condition: service_healthy

  spark-master:
    image: apache/spark:4.0.1
    profiles: [analytics]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    image: apache/spark:4.0.1
    profiles: [analytics]
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
    volumes:
      - assetflow_analytics_data:/srv/assetflow/analytics
    depends_on:
      spark-master:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_metadata_data:
  assetflow_analytics_data:
